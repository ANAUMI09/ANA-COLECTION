<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ayda Collection</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body, html {
      height: 100%;
    }

    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      background-color: rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(8px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 50px;
      z-index: 100;
    }

    header h1 {
      color: #c83382;
      font-size: 26px;
      font-weight: bold;
    }

    nav a {
      text-decoration: none;
      color: #c83382;
      font-weight: bold;
      margin-left: 25px;
      font-size: 16px;
      transition: 0.3s;
    }

    nav a:hover {
      color: #9c155d;
    }

    .hero {
      height: 100vh;
      background-image: url('https://static.vecteezy.com/system/resources/previews/004/299/830/original/shopping-online-on-phone-with-podium-paper-art-modern-pink-background-gifts-box-illustration-free-vector.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .hero h2 {
      color: #fff;
      font-size: 50px;
      text-shadow: 2px 2px 8px rgba(0,0,0,0.4);
      margin-bottom: 20px;
      background-color: rgba(0,0,0,0.3);
      padding: 10px 20px;
      border-radius: 10px;
    }

    .hero a {
      text-decoration: none;
      background-color: #c83382;
      color: white;
      padding: 14px 40px;
      border-radius: 8px;
      font-size: 20px;
      font-weight: bold;
      transition: 0.3s;
      box-shadow: 0 3px 6px rgba(0,0,0,0.3);
    }

    .hero a:hover {
      background-color: #9c155d;
      transform: scale(1.05);
    }

    footer {
      position: absolute;
      bottom: 10px;
      width: 100%;
      text-align: center;
      color: white;
      font-size: 14px;
      text-shadow: 1px 1px 4px rgba(0,0,0,0.7);
    }
  </style>
</head>
<body>
  <header>
    <h1>Ana Collection</h1>
    <nav>
      <a href="index.html">Beranda</a>
      <a href="produk.html">Produk</a>
      <a href="tentang.html">Tentang Kami</a>
    </nav>
  </header>

  <div class="hero">
    <h2>Selamat Datang di Ana Collection 💖</h2>
    <a href="produk.html">Belanja Sekarang</a>
  </div>

  <footer>© 2026 Ana Collection | Fashion Elegan untuk Semua 🌸</footer>
</body>
</html>
